[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# The test contract inherits forge-std and is larger than the default test-runner
# EIP-170 limit. This only raises the local test executor limit; it does not change
# the bytecode or limits of any deployed contract.
code_size_limit = 100_000
remappings = ["forge-std/=lib/forge-std/src/"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
