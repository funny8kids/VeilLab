<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VeilLab · Prototype Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23080a0d'/%3E%3Cpath d='M12 3l7 4v10l-7 4-7-4V7z' fill='none' stroke='%235eead4' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#080a0d; --surface:#0f1318; --surface-2:#141a20; --line:#232b34;
    --text:#eef3f6; --muted:#98a4b0; --faint:#64717d; --accent:#5eead4;
    --sans:"Segoe UI",Inter,ui-sans-serif,system-ui,sans-serif;
    --mono:"Cascadia Code",Consolas,monospace;
  }
  html[data-sheet="light"] {
    --bg:#f3f4f1; --surface:#ffffff; --surface-2:#f7f8f5; --line:#e3e6df;
    --text:#111714; --muted:#5f6b63; --faint:#8a958d; --accent:#0f766e;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:34px 38px 44px;
    background:
      radial-gradient(900px 420px at 80% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      radial-gradient(700px 360px at 5% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--sans); font-size:13px;
  }
  .head { display:flex; align-items:flex-end; gap:20px; margin-bottom:24px; }
  .brand { display:flex; align-items:center; gap:11px; }
  .mark { width:34px; height:34px; border-radius:10px; background:color-mix(in srgb,var(--accent) 12%,transparent); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); color:var(--accent); display:grid; place-items:center; font-size:17px; }
  h1 { font-size:25px; margin:0; letter-spacing:-.035em; }
  .sub { color:var(--muted); margin-top:5px; font-size:11.5px; }
  .meta { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:9.5px; color:var(--faint); }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--muted); font-size:9px; font-weight:650; }
  .pill.accent { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 28%,transparent); background:color-mix(in srgb,var(--accent) 8%,transparent); }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.12); }
  .shot { height:292px; background:var(--surface-2); border-bottom:1px solid var(--line); display:grid; place-items:center; overflow:hidden; }
  .shot img { width:100%; height:100%; object-fit:contain; display:block; }
  .cap { padding:12px 14px 13px; display:flex; gap:10px; }
  .num { font-family:var(--mono); font-size:8.5px; color:var(--accent); padding-top:2px; width:16px; flex:none; }
  .cap h2 { font-size:12px; margin:0; font-weight:650; letter-spacing:.05px; }
  .cap p { margin:3px 0 0; font-size:10px; color:var(--faint); line-height:1.45; }
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .compare .shot { height:340px; }
  .compare .card { grid-column:span 1; }
  .label { display:inline-flex; align-items:center; gap:5px; font-size:8px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:7px; }
  .label i { width:5px; height:5px; border-radius:50%; background:var(--accent); display:inline-block; }
  .foot { margin-top:22px; display:flex; align-items:center; gap:14px; font-size:9.5px; color:var(--faint); }
  .foot .right { margin-left:auto; font-family:var(--mono); font-size:9px; }
</style>
</head>
<body>
  <div class="head">
    <div class="brand">
      <div class="mark">◈</div>
      <div><h1 id="title">VeilLab · Product Prototype</h1><div class="sub" id="subtitle">Eight screens · private pool · testnet only</div></div>
    </div>
    <div class="meta"><span class="pill accent" id="mode">DARK · EN</span><span class="pill">8 core screens</span><span>v1.3 · 2026-11-02</span></div>
  </div>
  <div id="grid" class="grid"></div>
  <div class="foot"><span>Interactive HTML prototype · no backend · no real transactions</span><span class="right">prototype/index.html</span></div>
<script>
  const screens = [
    ["overview", "Overview", "总览", "Pool health, anonymity set, compliance and quick actions.", "池子健康度、匿名集、合规状态与快捷操作。"],
    ["deposit", "Deposit", "存入", "Fixed-denomination deposit with a secret note backup.", "固定面额存入，并生成与备份 secret note。"],
    ["withdraw", "Withdraw", "提取", "Note, recipient, relayer selection and proof submission.", "输入 note、收款地址、选择中继并提交证明。"],
    ["pools", "Pools", "资金池", "Independent anonymity sets by asset and denomination.", "按资产与面额划分的独立匿名集。"],
    ["activity", "Activity", "活动", "Private deposit and withdrawal history.", "只属于你的存入与提取记录。"],
    ["relayers", "Relayers", "中继", "Non-custodial submission, fees and uptime.", "非托管提交、费率与在线率。"],
    ["compliance", "Compliance", "合规", "Screening, limits, jurisdiction and audit.", "筛查、额度、司法辖区与审计。"],
    ["settings", "Settings", "设置", "Testnet network, note backups and session security.", "测试网、note 备份与会话安全。"]
  ];

  const params = new URLSearchParams(location.search);
  const set = params.get("set") || "dark";
  const isLight = set === "light-zh";
  const isCompare = set === "compare";
  document.documentElement.dataset.sheet = isLight ? "light" : "dark";

  const grid = document.getElementById("grid");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const mode = document.getElementById("mode");

  if (isCompare) {
    title.textContent = "VeilLab · Theme & Language";
    subtitle.textContent = "Private pool. Two atmospheres. Two languages.";
    mode.textContent = "DARK · EN / LIGHT · 中文";
    grid.className = "compare";
    const picks = ["overview", "deposit", "withdraw"];
    picks.forEach((id) => {
      const s = screens.find((x) => x[0] === id);
      const dark = document.createElement("div");
      dark.className = "card";
      dark.innerHTML = `<div class="shot"><img src="screenshots/v3-dark-${id}.png" alt=""></div><div class="cap"><div class="num">01</div><div><div class="label"><i></i>Dark · EN</div><h2>${s[1]}</h2><p>${s[3]}</p></div></div>`;
      grid.appendChild(dark);
      const light = document.createElement("div");
      light.className = "card";
      light.innerHTML = `<div class="shot"><img src="screenshots/v3-light-zh-${id}.png" alt=""></div><div class="cap"><div class="num">02</div><div><div class="label"><i></i>Light · 中文</div><h2>${s[2]}</h2><p>${s[4]}</p></div></div>`;
      grid.appendChild(light);
    });
  } else {
    title.textContent = isLight ? "VeilLab · 隐私池原型" : "VeilLab · Private Pool Prototype";
    subtitle.textContent = isLight ? "八屏隐私池 · 中英文 · 明暗双主题" : "Eight screens · private pool · testnet only";
    mode.textContent = isLight ? "LIGHT · 中文" : "DARK · EN";
    screens.forEach((s, i) => {
      const card = document.createElement("div");
      card.className = "card";
      const prefix = isLight ? "v3-light-zh-" : "v3-dark-";
      const name = isLight ? s[2] : s[1];
      const desc = isLight ? s[4] : s[3];
      card.innerHTML = `<div class="shot"><img src="screenshots/${prefix}${s[0]}.png" alt=""></div><div class="cap"><div class="num">${String(i + 1).padStart(2, "0")}</div><div><h2>${name}</h2><p>${desc}</p></div></div>`;
      grid.appendChild(card);
    });
    const note = document.createElement("div");
    note.className = "card";
    note.style.cssText = "display:flex;flex-direction:column;justify-content:center;padding:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface));";
    note.innerHTML = `<div class="label"><i></i>${isLight ? "混币器优先" : "Mixer-first"}</div><h2 style="font-size:17px;line-height:1.3;margin:6px 0 8px">${isLight ? "实验室退场，<br>资金池成为产品。" : "The lab is gone.<br>The pool is the product."}</h2><p style="font-size:10.5px;color:var(--faint);line-height:1.6;margin:0">${isLight ? "存入 → 等待 → 提取。固定面额、匿名集、中继与合规检查构成完整闭环。" : "Deposit → wait → withdraw. Fixed denominations, anonymity sets, relayers and compliance checks form the loop."}</p><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:12px"><span class="pill">8 screens</span><span class="pill">EN / 中文</span><span class="pill">Dark / Light</span></div>`;
    grid.appendChild(note);
  }
  document.title = title.textContent;
</script>
</body>
</html>
