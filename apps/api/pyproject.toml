[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veilpool-api"
version = "0.1.0"
description = "Testnet/local-only VeilPool API MVP (mock + local Anvil)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["veilpool_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
