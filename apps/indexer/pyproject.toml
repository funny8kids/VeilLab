[project]
name = "veilpool-indexer"
version = "0.1.0"
description = "Local-chain VeilPool event indexer (MOCK verifier, no ZK)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
